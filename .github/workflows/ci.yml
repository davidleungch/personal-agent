name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_FIXTURES: "1"
      TEST_DATABASE_URL: postgresql://personal_agent:personal_agent_test@127.0.0.1:5432/personal_agent_test
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: personal_agent_test
          POSTGRES_PASSWORD: personal_agent_test
          POSTGRES_USER: personal_agent
        options: >-
          --health-cmd "pg_isready -U personal_agent -d personal_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @personal-agent/tools exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm build
      - run: docker compose config --quiet
      - run: docker compose build
