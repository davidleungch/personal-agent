name: personal-agent

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: personal_agent
      POSTGRES_PASSWORD: personal_agent_local
      POSTGRES_USER: personal_agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_agent -d personal_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      target: app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--eval",
          "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--eval",
          "fetch('http://127.0.0.1:3001/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
