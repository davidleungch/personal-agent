name: personal-agent

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: personal_agent
      POSTGRES_PASSWORD: personal_agent_local
      POSTGRES_USER: personal_agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personal_agent -d personal_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      target: app
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://personal_agent:personal_agent_local@postgres:5432/personal_agent
      WORKER_HEALTH_URL: http://worker:3001/health
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--eval",
          "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: workspace
    command:
      [
        "pnpm",
        "--filter",
        "@personal-agent/db",
        "migrate"
      ]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://personal_agent:personal_agent_local@postgres:5432/personal_agent
    init: true
    restart: "no"

  worker:
    build:
      context: .
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      BROWSER_PROFILE_DIR: /var/lib/personal-agent/browser-profile
      DATABASE_URL: postgresql://personal_agent:personal_agent_local@postgres:5432/personal_agent
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--eval",
          "fetch('http://127.0.0.1:3001/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    init: true
    restart: unless-stopped
    volumes:
      - browser-profile:/var/lib/personal-agent/browser-profile

volumes:
  browser-profile:
  postgres-data:
